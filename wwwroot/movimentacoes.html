<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estoque - Movimentações</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h2>Gestão de Movimentações</h2>

        <form id="formMovimentacao">
            <h3>+ Nova Movimentação</h3>
            <input type="text" id="numeroMovimentacao" placeholder="Número da movimentação" required>
            <select id="tipoMovimentacao" required>
                <option value="">Selecione o tipo</option>
                <option value="consumo_interno">Consumo Interno</option>
                <option value="doacao_realizada">Doação Realizada</option>
                <option value="compra">Compra</option>
                <option value="doacao_recebida">Doação Recebida</option>

            </select>
            <input type="number" id="itemId" placeholder="ID do item" required>
            <input type="number" id="quantidade" placeholder="Quantidade" required>
            <input type="number" step="0.01" id="valorUnitario" placeholder="Valor unitário">
            <input type="number" id="parceiroId" placeholder="ID do parceiro">
            <input type="number" id="responsavelId" placeholder="ID do responsável" required>
            <input type="date" id="dataMovimentacao" required>
            <input type="text" id="beneficiario" placeholder="Beneficiário">
            <input type="text" id="descricaoSaida" placeholder="Descrição da saída">
            <input type="text" id="observacoes" placeholder="Observações">
            <button type="submit">Salvar</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Número</th>
                    <th>Tipo</th>
                    <th>Item</th>
                    <th>Qtd.</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela">
                <tr><td colspan="7">Carregando dados...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="/js/movimentacoes.js"></script>
</body>
</html>
